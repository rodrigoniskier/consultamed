name: Apply physical record status labels

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-ficha-status.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Agenda Global status labels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/SecretaryDashboard.tsx')
          text = path.read_text()
          old = "{appt.status === 'nao_compareceu' ? 'não compareceu' : appt.status}"
          new = "{appt.status === 'agendado' ? ((appt.secretary_notes || '').toUpperCase().includes('FICHA/PRONTUÁRIO FÍSICO: SIM') ? 'Tem ficha' : 'Não tem ficha') : appt.status === 'nao_compareceu' ? 'não compareceu' : appt.status}"

          count = text.count(old)
          if count != 2:
              raise SystemExit(f'Esperadas 2 ocorrências do status atual; encontradas {count}. Abortando.')

          path.write_text(text.replace(old, new))
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/apply-ficha-status.yml

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/SecretaryDashboard.tsx .github/workflows/apply-ficha-status.yml
          git commit -m "Update attendance map physical record status"
          git push
